<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Shah Tunnel — Futuristic Cybersecurity Emblem</title>
<desc id="desc">A fully vector cyberpunk tunnel with blue and gold neon lights, a crowned shield, luminous portal, and Shah Tunnel branding.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#020713"/><stop offset=".5" stop-color="#061a32"/><stop offset="1" stop-color="#01040b"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#087dff" stop-opacity=".42"/><stop offset=".6" stop-color="#0058c9" stop-opacity=".13"/><stop offset="1" stop-color="#020713" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffbd4"/><stop offset=".17" stop-color="#ffdf72"/><stop offset=".38" stop-color="#bd7818"/><stop offset=".55" stop-color="#fff0a4"/><stop offset=".76" stop-color="#d18c22"/><stop offset="1" stop-color="#fff1b0"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9fbff"/><stop offset=".25" stop-color="#26caff"/><stop offset=".6" stop-color="#0878ff"/><stop offset="1" stop-color="#06245e"/></linearGradient>
 <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17446f"/><stop offset=".55" stop-color="#061328"/><stop offset="1" stop-color="#0b3158"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#102d49"/><stop offset=".25" stop-color="#020711"/><stop offset="1" stop-color="#000207"/></linearGradient>
 <filter id="glowB" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowG" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <pattern id="grille" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#14517c" stroke-width="1" opacity=".38"/></pattern>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<ellipse cx="768" cy="455" rx="590" ry="470" fill="url(#halo)"/>
